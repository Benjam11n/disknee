services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - disknee_node_modules:/app/node_modules
      - disknee_next_cache:/app/.next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    platform: linux/amd64
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--reload",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/run.py:/app/run.py

volumes:
  disknee_next_cache:
  disknee_node_modules:
