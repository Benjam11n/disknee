[project]
name = "disknee-pose-backend"
version = "0.1.0"
description = "Pose detection backend for DisKnee"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.11",
  "mediapipe==0.10.21",
  "numpy>=1.26.0",
  "opencv-python==4.10.0.84",
  "psutil==6.1.0",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "uvicorn[standard]==0.34.0",
  "websockets==14.0",
]

[dependency-groups]
dev = [
  "black==24.10.0",
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.1",
]

[tool.uv]
package = false
