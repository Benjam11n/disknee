[project]
name = "disknee-pose-backend"
version = "0.1.0"
description = "Pose detection backend for DisKnee"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.11",
  "mediapipe==0.10.21",
  "numpy>=1.26.0",
  "opencv-python==4.10.0.84",
  "psutil==7.2.2",
  "pydantic==2.10.6",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.22",
  "structlog==25.5.0",
  "uvicorn[standard]==0.34.0",
  "websockets==14.0",
]

[dependency-groups]
dev = [
  "black==26.3.1",
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
